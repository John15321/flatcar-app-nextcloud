---
name: "YAML Validation"

# Trigger the workflow on push to main branch, pull requests, and manual dispatch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-yaml-syntax:
    name: "Validate YAML Syntax"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: "Install YAML Linter"
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          
      - name: "Validate YAML Syntax"
        run: |
          echo "Validating all YAML files for syntax errors..."
          find . -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "Checking: $file"
            yamllint -d relaxed "$file"
          done

  validate-docker-compose:
    name: "Validate Docker Compose"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        
      - name: "Validate Docker Compose File"
        run: |
          echo "Validating docker-compose.yml..."
          cd files/configs
          docker-compose config --quiet
          echo "✅ Docker Compose file is valid"
          
          echo "Validating production docker-compose.prod.yml..."
          cd ../../production/configs
          docker-compose -f docker-compose.prod.yml config --quiet
          echo "✅ Production Docker Compose file is valid"
          
          echo "Validating internal HTTPS docker-compose.internal-https.yml..."
          docker-compose -f docker-compose.internal-https.yml config --quiet
          echo "✅ Internal HTTPS Docker Compose file is valid"

  validate-flatcar-configs:
    name: "Validate Flatcar Configuration"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Install Butane"
        run: |
          # Download and install Butane (latest stable version)
          BUTANE_VERSION=$(curl -s https://api.github.com/repos/coreos/butane/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          echo "Installing Butane version: $BUTANE_VERSION"
          
          curl -L "https://github.com/coreos/butane/releases/download/${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu" \
            -o butane
          chmod +x butane
          sudo mv butane /usr/local/bin/
          
          # Verify installation
          butane --version
          
      - name: "Validate Development Configuration"
        run: |
          echo "Validating nextcloud-development.yaml..."
          butane --pretty --strict nextcloud-development.yaml > /dev/null
          echo "✅ Development configuration is valid"
          
      - name: "Validate Production Configuration"
        run: |
          echo "Validating production/nextcloud-production.yaml..."
          cd production && butane --pretty --strict --files-dir=. nextcloud-production.yaml > /dev/null
          echo "✅ Production configuration is valid"
          
      - name: "Generate Ignition File (Artifact)"
        run: |
          echo "Generating Ignition file for validation..."
          mkdir -p ignition-artifacts
          
          butane --pretty --strict nextcloud-development.yaml > ignition-artifacts/dev.ign
          
          echo "Generated Ignition file:"
          ls -la ignition-artifacts/
          
      - name: "Upload Ignition Artifacts"
        uses: actions/upload-artifact@v3
        with:
          name: ignition-config
          path: ignition-artifacts/
          retention-days: 30

  validate-iac:
    name: "Validate Infrastructure as Code"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tool: [terraform, opentofu]
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Setup Terraform"
        if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: latest
          
      - name: "Setup OpenTofu"
        if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
          
      - name: "Format Check"
        run: |
          cd production/azure
          if [ "${{ matrix.tool }}" = "terraform" ]; then
            terraform fmt -check=true
            echo "✅ Terraform formatting is correct"
          else
            tofu fmt -check=true
            echo "✅ OpenTofu formatting is correct"
          fi
          
      - name: "Validate Configuration"
        run: |
          cd production/azure
          if [ "${{ matrix.tool }}" = "terraform" ]; then
            terraform init -backend=false
            terraform validate
            echo "✅ Terraform configuration is valid"
          else
            tofu init -backend=false
            tofu validate
            echo "✅ OpenTofu configuration is valid"
          fi
