---
name: "YAML Validation"

# Trigger the workflow on push to main branch, pull requests, and manual dispatch
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-yaml-syntax:
    name: "Validate YAML Syntax"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: "Install YAML Linter"
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          
      - name: "Validate YAML Syntax"
        run: |
          echo "Validating all YAML files for syntax errors..."
          find . -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "Checking: $file"
            yamllint -d relaxed "$file"
          done

  validate-docker-compose:
    name: "Validate Docker Compose"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
        
      - name: "Validate Docker Compose File"
        run: |
          echo "Validating docker-compose.yml..."
          docker-compose config --quiet
          echo "✅ Docker Compose file is valid"

  validate-flatcar-configs:
    name: "Validate Flatcar Configurations"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Install Butane"
        run: |
          # Download and install Butane (latest stable version)
          BUTANE_VERSION=$(curl -s https://api.github.com/repos/coreos/butane/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          echo "Installing Butane version: $BUTANE_VERSION"
          
          curl -L "https://github.com/coreos/butane/releases/download/${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu" \
            -o butane
          chmod +x butane
          sudo mv butane /usr/local/bin/
          
          # Verify installation
          butane --version
          
      - name: "Validate Production Configuration"
        run: |
          echo "Validating nextcloud-production.yaml..."
          butane --pretty --strict nextcloud-production.yaml > /dev/null
          echo "✅ Production configuration is valid"
          
      - name: "Validate Development Configuration"
        run: |
          echo "Validating nextcloud-development.yaml..."
          butane --pretty --strict nextcloud-development.yaml > /dev/null
          echo "✅ Development configuration is valid"
          
      - name: "Generate Ignition Files (Artifact)"
        run: |
          echo "Generating Ignition files for validation..."
          mkdir -p ignition-artifacts
          
          butane --pretty --strict nextcloud-production.yaml > ignition-artifacts/nextcloud-production.ign
          butane --pretty --strict nextcloud-development.yaml > ignition-artifacts/nextcloud-development.ign
          
          echo "Generated Ignition files:"
          ls -la ignition-artifacts/
          
      - name: "Upload Ignition Artifacts"
        uses: actions/upload-artifact@v3
        with:
          name: ignition-configs
          path: ignition-artifacts/
          retention-days: 30

  lint-yaml-style:
    name: "YAML Style Linting"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Set up Python"
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: "Install YAML Linter"
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
          
      - name: "Create yamllint config"
        run: |
          cat > .yamllint.yml << 'EOF'
          extends: relaxed
          
          rules:
            line-length:
              max: 120
              level: warning
            indentation:
              spaces: 2
            truthy:
              allowed-values: ['true', 'false', 'on', 'off']
            comments:
              min-spaces-from-content: 1
            document-start: disable
            document-end: disable
          EOF
          
      - name: "Lint YAML Style"
        run: |
          echo "Checking YAML style and formatting..."
          find . -name "*.yaml" -o -name "*.yml" | while read file; do
            echo "Linting: $file"
            yamllint -c .yamllint.yml "$file" || echo "⚠️  Style issues found in $file"
          done

  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        
      - name: "Run Trivy Security Scanner"
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: "Upload Trivy Results"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
