variant: fcos
version: 1.4.0
passwd:
  users:
    - name: core
      groups:
        - docker
        - sudo
      ssh_authorized_keys:
        - "ssh-rsa AAAAB3NzaC1yc2E... your-ssh-key-here"

storage:
  directories:
    - path: /opt/nextcloud
      mode: 0755
    - path: /opt/nextcloud/data
      mode: 0755
    - path: /opt/nextcloud/config
      mode: 0755
    - path: /opt/nextcloud/apps
      mode: 0755
    - path: /opt/nextcloud/db
      mode: 0755
    - path: /opt/nextcloud/redis
      mode: 0755
    - path: /opt/nextcloud/ssl
      mode: 0755
    - path: /opt/nextcloud/scripts
      mode: 0755

  files:
    - path: /opt/nextcloud/docker-compose.yml
      mode: 0644
      contents:
        inline: |
          version: '3.8'

          services:
            nginx:
              image: nginx:alpine
              container_name: nextcloud-nginx
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./nginx.conf:/etc/nginx/nginx.conf:ro
                - ./ssl:/etc/nginx/ssl:ro
                - nextcloud_data:/var/www/html:ro
              depends_on:
                - nextcloud
              networks:
                - nextcloud-network

            nextcloud:
              image: nextcloud:latest
              container_name: nextcloud-app
              restart: unless-stopped
              ports:
                - "8080:80"  # Direct access for development
              volumes:
                - nextcloud_data:/var/www/html
                - ./config:/var/www/html/config
                - ./data:/var/www/html/data
                - ./apps:/var/www/html/custom_apps
              environment:
                - POSTGRES_HOST=db
                - POSTGRES_DB=nextcloud
                - POSTGRES_USER=nextcloud
                - POSTGRES_PASSWORD=development_password
                - NEXTCLOUD_ADMIN_USER=admin
                - NEXTCLOUD_ADMIN_PASSWORD=admin123
                - NEXTCLOUD_TRUSTED_DOMAINS=localhost,127.0.0.1,10.0.2.15,192.168.1.100
                - REDIS_HOST=redis
                - REDIS_HOST_PORT=6379
                - OVERWRITEPROTOCOL=https
                - OVERWRITECLIURL=https://localhost
              depends_on:
                - db
                - redis
              networks:
                - nextcloud-network

            db:
              image: postgres:15-alpine
              container_name: nextcloud-db
              restart: unless-stopped
              ports:
                - "5432:5432"  # Exposed for development/debugging
              volumes:
                - ./db:/var/lib/postgresql/data
              environment:
                - POSTGRES_DB=nextcloud
                - POSTGRES_USER=nextcloud
                - POSTGRES_PASSWORD=development_password
              networks:
                - nextcloud-network

            redis:
              image: redis:7-alpine
              container_name: nextcloud-redis
              restart: unless-stopped
              ports:
                - "6379:6379"  # Exposed for development/debugging
              volumes:
                - ./redis:/data
              command: redis-server --save 60 1 --loglevel warning
              networks:
                - nextcloud-network

            # Development tools
            adminer:
              image: adminer
              container_name: nextcloud-adminer
              restart: unless-stopped
              ports:
                - "8081:8080"
              environment:
                - ADMINER_DEFAULT_SERVER=db
              depends_on:
                - db
              networks:
                - nextcloud-network

          volumes:
            nextcloud_data:

          networks:
            nextcloud-network:
              driver: bridge

    - path: /opt/nextcloud/nginx.conf
      mode: 0644
      contents:
        inline: |
          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              
              client_max_body_size 16G;
              
              upstream nextcloud {
                  server nextcloud:80;
              }
              
              # HTTP server (development)
              server {
                  listen 80;
                  server_name _;
                  
                  location / {
                      proxy_pass http://nextcloud;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }
              
              # HTTPS server (with self-signed cert)
              server {
                  listen 443 ssl http2;
                  server_name _;
                  
                  ssl_certificate /etc/nginx/ssl/cert.pem;
                  ssl_certificate_key /etc/nginx/ssl/key.pem;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  
                  location / {
                      proxy_pass http://nextcloud;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;
                  }
              }
          }

    - path: /opt/nextcloud/scripts/generate-ssl.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          
          SSL_DIR="/opt/nextcloud/ssl"
          mkdir -p "$SSL_DIR"
          
          # Generate self-signed certificate for development
          openssl req -x509 -newkey rsa:2048 \
              -keyout "$SSL_DIR/key.pem" \
              -out "$SSL_DIR/cert.pem" \
              -days 365 -nodes \
              -subj "/C=US/ST=Dev/L=Local/O=Development/CN=localhost"
          
          echo "Self-signed certificate generated for development"

    - path: /opt/nextcloud/scripts/logs.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose logs -f "$@"

    - path: /opt/nextcloud/scripts/shell.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose exec nextcloud bash

    - path: /opt/nextcloud/scripts/occ.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose exec -u www-data nextcloud php occ "$@"

    - path: /etc/systemd/system/nextcloud-dev.service
      mode: 0644
      contents:
        inline: |
          [Unit]
          Description=Nextcloud Development Docker Compose Stack
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/nextcloud
          ExecStartPre=/opt/nextcloud/scripts/generate-ssl.sh
          ExecStartPre=/usr/bin/docker-compose down
          ExecStart=/usr/bin/docker-compose up -d
          ExecStop=/usr/bin/docker-compose down
          TimeoutStartSec=0

          [Install]
          WantedBy=multi-user.target

systemd:
  units:
    - name: nextcloud-dev.service
      enabled: true
    - name: docker.service
      enabled: true
