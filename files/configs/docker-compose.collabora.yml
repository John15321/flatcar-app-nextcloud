# =========================================================================
# COLLABORA ONLINE ADD-ON FOR NEXTCLOUD
# =========================================================================
#
# Optional Collabora Online service for document editing capabilities.
# Use this when you need office document editing in Nextcloud.
#
# To use:
# docker-compose -f docker-compose.yml -f docker-compose.collabora.yml up -d
#
# Access: http://localhost:9980
# =========================================================================

services:
  collabora:
    image: collabora/code:latest
    container_name: nextcloud-collabora
    restart: unless-stopped
    ports:
      - "9980:9980"
    cap_add:
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
    security_opt:
      - apparmor:unconfined
    environment:
      - username=admin
      - password=admin123
      - dictionaries=en_US,en_GB,de_DE,es_ES,fr_FR
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:net.frame_ancestors=localhost:*,127.0.0.1:*
      - domain=nextcloud-app|nextcloud|collabora
      - DONT_GEN_SSL_CERT=1
      - server_name=localhost
    networks:
      - nextcloud-network

networks:
  nextcloud-network:
    external: true
