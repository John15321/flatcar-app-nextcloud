# =========================================================================
# SIMPLIFIED NEXTCLOUD DEVELOPMENT SETUP
# =========================================================================
#
# This simplified Docker Compose file provides a basic Nextcloud development
# environment with only essential components:
# - Nextcloud application (direct access, no reverse proxy)
# - PostgreSQL database
# - Redis cache
# - Adminer for database management (development only)
#
# Access Nextcloud at: http://localhost:8080
# Access Adminer at: http://localhost:8081
#
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # NEXTCLOUD APPLICATION
  # -----------------------------------------------------------------------
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud-app
    restart: unless-stopped
    ports:
      - "8080:80"                  # Main Nextcloud access
    volumes:
      - nextcloud_data:/var/www/html
      - ./config:/var/www/html/config
      - ./data:/var/www/html/data
      - ./apps:/var/www/html/custom_apps
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
    depends_on:
      - db
      - redis
    networks:
      - nextcloud-network

  # -----------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # -----------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    ports:
      - "5432:5432"                # Exposed for development
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - nextcloud-network

  # -----------------------------------------------------------------------
  # REDIS CACHE
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    ports:
      - "6379:6379"                # Exposed for development
    volumes:
      - ./redis:/data
    command: redis-server --save 60 1 --loglevel warning
    networks:
      - nextcloud-network

  # -----------------------------------------------------------------------
  # ADMINER DATABASE MANAGEMENT (DEVELOPMENT ONLY)
  # -----------------------------------------------------------------------
  adminer:
    image: adminer
    container_name: nextcloud-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"                # Access at http://localhost:8081
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - nextcloud-network

volumes:
  nextcloud_data:

networks:
  nextcloud-network:
    driver: bridge