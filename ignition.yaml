variant: fcos
version: 1.4.0
passwd:
  users:
    - name: nextcloud
      uid: 1000
      gid: 1000
      home_dir: /home/nextcloud
      shell: /bin/bash
      groups:
        - docker
        - sudo
      ssh_authorized_keys:
        - "ssh-rsa AAA...."

storage:
  directories:
    - path: /opt/nextcloud
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/data
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/config
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/apps
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/db
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/redis
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/nginx
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/ssl
      mode: 0700
      user:
        name: nextcloud
      group:
        name: nextcloud
    - path: /opt/nextcloud/backups
      mode: 0755
      user:
        name: nextcloud
      group:
        name: nextcloud

  files:
    - path: /opt/nextcloud/docker-compose.yml
      mode: 0644
      user:
        name: nextcloud
      group:
        name: nextcloud
      contents:
        local: docker-compose.yml
    - path: /opt/nextcloud/.env
      mode: 0600
      user:
        name: nextcloud
      group:
        name: nextcloud
      contents:
        local: .env
    - path: /opt/nextcloud/nginx/nextcloud.conf
      mode: 0644
      user:
        name: nextcloud
      group:
        name: nextcloud
      contents:
        local: nginx/nextcloud.conf
    - path: /etc/systemd/system/nextcloud.service
      mode: 0644
      contents:
        local: systemd/nextcloud.service

systemd:
  units:
    - name: nextcloud.service
      enabled: true
    - name: docker.service
      enabled: true
