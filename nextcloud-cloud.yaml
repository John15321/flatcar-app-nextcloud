variant: flatcar
version: 1.0.0
storage:
  files:
    - path: /etc/nextcloud.env
      mode: 0600
      contents:
        inline: |
          # Nextcloud admin credentials
          NEXTCLOUD_ADMIN_USER=admin
          NEXTCLOUD_ADMIN_PASSWORD=changeme_nextcloud_admin_password
          
          # Database settings
          MYSQL_HOST=localhost
          MYSQL_DATABASE=nextcloud
          MYSQL_USER=nextcloud
          MYSQL_PASSWORD=changeme_mysql_password
          MYSQL_ROOT_PASSWORD=changeme_mysql_root_password
    - path: /usr/local/bin/setup-cloud-disk.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          # Auto-detect and setup cloud storage disk
          # For common cloud environments (AWS, GCP, Azure)
          
          # Wait for cloud init to finish and disks to be attached
          cloud-init status --wait
          
          # Look for the first additional disk
          DISKS=$(lsblk -dpn -o NAME | grep -v "$(lsblk -dpn -o NAME,MOUNTPOINT | grep -w "/" | cut -d' ' -f1)")
          
          # Get first non-boot disk
          DATA_DISK=$(echo "$DISKS" | head -n1)
          
          if [ -z "$DATA_DISK" ]; then
            echo "No additional disk found, using root filesystem"
            mkdir -p /var/lib/nextcloud_data
            exit 0
          fi
          
          echo "Setting up disk $DATA_DISK for Nextcloud data"
          
          # Check if disk is already formatted
          if ! blkid "$DATA_DISK" >/dev/null; then
            # Format disk
            mkfs.ext4 -L NC_DATA "$DATA_DISK"
          fi
          
          # Create mount point
          mkdir -p /var/lib/nextcloud_data
          
          # Mount disk
          mount "$DATA_DISK" /var/lib/nextcloud_data
          
          # Add to fstab for persistence
          echo "LABEL=NC_DATA /var/lib/nextcloud_data ext4 defaults,nofail 0 2" >> /etc/fstab
          
          echo "Disk setup completed"
systemd:
  units:
    - name: docker.service
      enabled: true
    - name: setup-cloud-disk.service
      enabled: true
      contents: |
        [Unit]
        Description=Set up cloud storage for Nextcloud
        Before=setup-nextcloud-dirs.service
        After=docker.service
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/usr/local/bin/setup-cloud-disk.sh
        
        [Install]
        WantedBy=multi-user.target
    - name: setup-nextcloud-dirs.service
      enabled: true
      contents: |
        [Unit]
        Description=Setup Nextcloud Directory Structure
        After=setup-cloud-disk.service
        Before=mariadb-container.service nextcloud-container.service
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/mkdir -p /var/lib/nextcloud_data/db
        ExecStart=/bin/mkdir -p /var/lib/nextcloud_data/data
        ExecStart=/bin/mkdir -p /var/lib/nextcloud_data/config
        ExecStart=/bin/chown -R 33:33 /var/lib/nextcloud_data/data
        ExecStart=/bin/chown -R 33:33 /var/lib/nextcloud_data/config
        ExecStart=/bin/chmod 700 /var/lib/nextcloud_data/db
        
        [Install]
        WantedBy=multi-user.target
    - name: mariadb-container.service
      enabled: true
      contents: |
        [Unit]
        Description=MariaDB Container for Nextcloud
        After=docker.service setup-nextcloud-dirs.service
        Requires=docker.service setup-nextcloud-dirs.service
        
        [Service]
        TimeoutStartSec=0
        Restart=always
        ExecStartPre=-/usr/bin/docker stop %n
        ExecStartPre=-/usr/bin/docker rm %n
        ExecStartPre=/usr/bin/docker pull mariadb:10.7
        ExecStart=/usr/bin/docker run --rm --name %n \
          --env MYSQL_DATABASE=nextcloud \
          --env MYSQL_USER=nextcloud \
          --env MYSQL_PASSWORD_FILE=/run/secrets/db_password \
          --env MYSQL_ROOT_PASSWORD_FILE=/run/secrets/db_root_password \
          --volume /etc/nextcloud.env:/run/secrets/nextcloud.env:ro \
          --volume /var/lib/nextcloud_data/db:/var/lib/mysql \
          --volume /usr/share/zoneinfo/UTC:/etc/localtime:ro \
          --network host \
          --publish 127.0.0.1:3306:3306 \
          --mount type=bind,source=/etc/nextcloud.env,target=/run/secrets/nextcloud.env,readonly \
          --mount type=bind,source=/bin/grep,target=/bin/grep,readonly \
          --mount type=tmpfs,destination=/run/secrets \
          mariadb:10.7
        ExecStartPost=-/bin/sh -c "grep MYSQL_PASSWORD /etc/nextcloud.env | cut -d= -f2 > /proc/$(docker inspect --format '{{.State.Pid}}' %n)/root/run/secrets/db_password"
        ExecStartPost=-/bin/sh -c "grep MYSQL_ROOT_PASSWORD /etc/nextcloud.env | cut -d= -f2 > /proc/$(docker inspect --format '{{.State.Pid}}' %n)/root/run/secrets/db_root_password"
        
        [Install]
        WantedBy=multi-user.target
    - name: nextcloud-container.service
      enabled: true
      contents: |
        [Unit]
        Description=Nextcloud Container
        After=mariadb-container.service
        Requires=mariadb-container.service
        
        [Service]
        TimeoutStartSec=0
        Restart=always
        ExecStartPre=-/usr/bin/docker stop %n
        ExecStartPre=-/usr/bin/docker rm %n
        ExecStartPre=/usr/bin/docker pull nextcloud:latest
        ExecStart=/usr/bin/docker run --rm --name %n \
          --env-file /etc/nextcloud.env \
          --volume /var/lib/nextcloud_data/config:/var/www/html/config \
          --volume /var/lib/nextcloud_data/data:/var/www/html/data \
          --volume /usr/share/zoneinfo/UTC:/etc/localtime:ro \
          --publish 80:80 \
          nextcloud:latest
        
        [Install]
        WantedBy=multi-user.target