# =========================================================================
# NEXTCLOUD DEVELOPMENT SETUP WITH AUTOMATED APP INSTALLATION
# =========================================================================
#
# This Butane configuration creates a complete Nextcloud development
# environment with automatic app installation:
#
# FEATURES:
# - Direct Nextcloud access (no reverse proxy)
# - Simple, memorable passwords (admin/admin123)
# - PostgreSQL database with Redis cache
# - Collabora Online for document editing
# - Adminer for database management
# - Automatic installation of essential apps
#
# ARCHITECTURE:
# - Nextcloud (latest) + PostgreSQL 15 + Redis 7 + Collabora
# - Direct access via port 8080
# - Essential productivity and development apps pre-installed
# - Collabora integration configured automatically
#
# QUICK START:
# 1. Replace SSH key below with your public key
# 2. Convert: butane --pretty --strict nextcloud-development.yaml > dev.ign
# 3. Run: ./flatcar_production_qemu.sh -i dev.ign -M 4096 -f 8080:8080 -f 8081:8081 -f 9980:9980
# 4. Access: http://localhost:8080 (admin/admin123)
# 5. Collabora: http://localhost:9980
#
# =========================================================================

variant: flatcar
version: 1.0.0

passwd:
  users:
  - name: core
    groups:
    - docker
    - sudo
    ssh_authorized_keys:
    - "ssh-rsa  jan@jan-B550-GAMING-X-V2"
    # Replace with your SSH public key

storage:
  directories:
  - path: /opt/nextcloud
    mode: 493 # 0755 in decimal
  - path: /opt/bin
    mode: 493 # 0755 in decimal
  files:
  # Configuration files
  - path: /opt/nextcloud/.env
    mode: 384 # 0600 in decimal
    contents:
      local: configs/.env

  - path: /opt/nextcloud/docker-compose.yml
    mode: 420 # 0644 in decimal
    contents:
      local: configs/docker-compose.yml

  # Optional Collabora add-on
  - path: /opt/nextcloud/docker-compose.collabora.yml
    mode: 420 # 0644 in decimal
    contents:
      local: configs/docker-compose.collabora.yml

  # Essential utility scripts
  - path: /opt/bin/nextcloud-logs.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-logs.sh

  - path: /opt/bin/nextcloud-shell.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-shell.sh

  - path: /opt/bin/nextcloud-occ.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-occ.sh

  - path: /opt/bin/nextcloud-reset.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-reset.sh

  # App installation script
  - path: /opt/bin/nextcloud-install-apps.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-install-apps.sh

  # Collabora configuration script
  - path: /opt/bin/nextcloud-collabora-setup.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-collabora-setup.sh

  # Collabora debugging script
  - path: /opt/bin/nextcloud-debug-collabora.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-debug-collabora.sh

  # Collabora quick fix script
  - path: /opt/bin/nextcloud-fix-collabora.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-fix-collabora.sh

  # Systemd services
  - path: /etc/systemd/system/docker-compose-setup.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/docker-compose-setup.service

  - path: /etc/systemd/system/setup-nextcloud-dev.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/setup-nextcloud-dev.service

  - path: /etc/systemd/system/nextcloud-dev.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/nextcloud-dev.service

  - path: /etc/systemd/system/nextcloud-install-apps.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/nextcloud-install-apps.service

  - path: /etc/systemd/system/nextcloud-collabora-setup.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/nextcloud-collabora-setup.service

systemd:
  units:
  - name: docker.service
    enabled: true

  - name: docker-compose-setup.service
    enabled: true

  - name: systemd-sysext.service
    enabled: true

  - name: setup-nextcloud-dev.service
    enabled: true

  - name: nextcloud-dev.service
    enabled: true

  - name: nextcloud-install-apps.service
    enabled: true

  - name: nextcloud-collabora-setup.service
    enabled: true
