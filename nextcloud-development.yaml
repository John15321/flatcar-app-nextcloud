# =========================================================================
# NEXTCLOUD DEVELOPMENT CONFIGURATION FOR FLATCAR CONTAINER LINUX
# =========================================================================
#
# This Butane configuration creates a development-friendly Nextcloud setup
# optimized for local testing, learning, and development work with:
#
# DEVELOPMENT FEATURES:
# - Simple, memorable passwords (admin/admin123)
# - Adminer database management interface (:8081)
# - Exposed database ports for external tools
# - Multiple trusted domains for local access
# - Lower resource requirements
#
# ARCHITECTURE:
# - Nextcloud (latest) with PostgreSQL 15 and Redis 7
# - Nginx reverse proxy for production-like setup
# - All data stored on root filesystem (no additional disk needed)
# - Development tools included (Adminer)
#
# INTENDED USE:
# - Local development on laptop/PC
# - Testing Nextcloud configurations
# - Learning how the system works
# - Debugging and troubleshooting
#
# NOT FOR PRODUCTION:
# - Simple passwords are insecure
# - Exposed database ports
# - Development tools included
# - Less restrictive security settings
#
# QUICK START:
# 1. Replace "your-ssh-key-here" with your SSH public key
# 2. Convert: butane --pretty --strict nextcloud-development.yaml > dev.ign
# 3. Run: ./flatcar_production_qemu.sh -i dev.ign -M 4096 -f 8080:8080 -f 8081:8081
# 4. Access: http://localhost:8080 (admin/admin123)
#
# =========================================================================

variant: flatcar
version: 1.0.0

# Development configuration for Nextcloud on Flatcar Linux
# This configuration is optimized for development and testing

# USER CONFIGURATION
# Uses the default 'core' user for simplicity in development
passwd:
  users:
    - name: core                   # Default Flatcar user
      groups:
        - docker                   # Access to Docker daemon
        - sudo                     # Administrative privileges
      ssh_authorized_keys:
        - "ssh-rsa  janbronicki@DESKTOP-SNSADQ2"
        # Add your public SSH key above - generate with: ssh-keygen -t ed25519
        # This allows SSH access: ssh -p 2222 core@localhost

storage:
  # DIRECTORY STRUCTURE
  # Simple directory-based storage on root filesystem
  # No additional disks needed - perfect for development VMs
  directories:
    - path: /opt/nextcloud         # Main application directory
      mode: 0755
    - path: /opt/bin               # Development scripts directory
      mode: 0755
    - path: /var/log/nextcloud     # Centralized logging
      mode: 0755

  files:
    # ENVIRONMENT CONFIGURATION
    # Contains all the settings for the Nextcloud stack
    # Development-friendly with simple passwords
    - path: /opt/nextcloud/.env
      mode: 0600                   # Secure file permissions
      contents:
        inline: |
          # Development Configuration for Nextcloud with PostgreSQL
          # Simple settings for local testing and development
          
          # PostgreSQL Database Configuration
          POSTGRES_DB=nextcloud
          POSTGRES_USER=nextcloud
          POSTGRES_PASSWORD=development_password
          
          # Nextcloud Admin Configuration (simple for testing)
          NEXTCLOUD_ADMIN_USER=admin
          NEXTCLOUD_ADMIN_PASSWORD=admin123
          
          # Domain Configuration (for local development)
          NEXTCLOUD_DOMAIN=localhost
          NEXTCLOUD_TRUSTED_DOMAINS=localhost,127.0.0.1,10.0.2.15,192.168.1.100
          
          # Redis Cache Configuration
          REDIS_HOST=redis
          REDIS_PORT=6379
          
          # Development settings (more permissive)
          PHP_MEMORY_LIMIT=256M
          PHP_UPLOAD_LIMIT=1G
          
          # Development Notes:
          # - Simple passwords for easy testing
          # - Includes Adminer for database management
          # - Exposed ports for development tools
          # - Multiple trusted domains for various networking scenarios
          # - Self-signed SSL certificates will show browser warnings

    # Docker Compose configuration
    - path: /opt/nextcloud/docker-compose.yml
      mode: 0644
      contents:
        inline: |
          # =========================================================================
          # NEXTCLOUD DOCKER COMPOSE CONFIGURATION
          # =========================================================================
          #
          # This Docker Compose file defines the complete Nextcloud stack with:
          # - Nginx reverse proxy (SSL termination, static file serving)
          # - Nextcloud application (PHP-FPM with extensions)
          # - PostgreSQL 15 database (reliable, high-performance)
          # - Redis cache (session storage, file locking, memory cache)
          # - Adminer database management (development only)
          #
          # NETWORKING:
          # All services communicate over a private Docker network for security.
          # Only required ports are exposed to the host system.
          #
          # STORAGE:
          # - PostgreSQL data: ./db (persistent database storage)
          # - Nextcloud data: ./data (user files and uploads)
          # - Nextcloud config: ./config (application configuration)
          # - Custom apps: ./apps (additional Nextcloud applications)
          # - SSL certificates: ./ssl (TLS certificates for HTTPS)
          #
          # ENVIRONMENT VARIABLES:
          # Configuration is externalized via .env file for security and flexibility.
          # This allows different settings for production vs development without
          # changing the compose file.
          #
          # =========================================================================

          version: '3.8'

          services:
            # -----------------------------------------------------------------------
            # NGINX REVERSE PROXY
            # -----------------------------------------------------------------------
            # Handles HTTP/HTTPS traffic, SSL termination, and static file serving
            # Benefits: Better performance, security headers, rate limiting
            nginx:
              image: nginx:alpine            # Lightweight, security-focused
              container_name: nextcloud-nginx
              restart: unless-stopped        # Auto-restart on failure
              ports:
                - "80:80"                    # HTTP traffic
                - "443:443"                  # HTTPS traffic (SSL/TLS)
              volumes:
                - ./nginx/nextcloud.conf:/etc/nginx/nginx.conf:ro  # Nginx configuration
                - ./ssl:/etc/nginx/ssl:ro    # SSL certificates directory
                - nextcloud_data:/var/www/html:ro  # Nextcloud files (read-only)
              depends_on:
                - nextcloud                  # Start after Nextcloud is ready
              networks:
                - nextcloud-network

            # -----------------------------------------------------------------------
            # NEXTCLOUD APPLICATION
            # -----------------------------------------------------------------------
            # Main PHP application with all required extensions for Nextcloud
            nextcloud:
              image: nextcloud:latest        # Official Nextcloud image
              container_name: nextcloud-app
              restart: unless-stopped
              ports:
                - "8080:80"                  # Direct access for development/debugging
              volumes:
                - nextcloud_data:/var/www/html      # Main application files
                - ./config:/var/www/html/config     # Configuration persistence
                - ./data:/var/www/html/data         # User data and uploads
                - ./apps:/var/www/html/custom_apps  # Custom applications
              environment:
                # Database connection settings
                - POSTGRES_HOST=db
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                
                # Nextcloud admin account
                - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
                - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
                - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS}
                
                # Redis cache configuration
                - REDIS_HOST=redis
                - REDIS_HOST_PORT=6379
                
                # HTTPS configuration (when behind reverse proxy)
                - OVERWRITEPROTOCOL=https
                - OVERWRITECLIURL=https://${NEXTCLOUD_DOMAIN}
              depends_on:
                - db                         # Database must be ready first
                - redis                      # Cache must be available
              networks:
                - nextcloud-network
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost/status.php"]
                interval: 30s                # Check every 30 seconds
                timeout: 10s                 # 10 second timeout
                retries: 3                   # Retry 3 times before marking unhealthy

            # -----------------------------------------------------------------------
            # POSTGRESQL DATABASE
            # -----------------------------------------------------------------------
            # Primary data store for Nextcloud with optimized settings
            db:
              image: postgres:15-alpine      # Latest stable PostgreSQL
              container_name: nextcloud-db
              restart: unless-stopped
              ports:
                - "5432:5432"                # Exposed for development/debugging
              volumes:
                - ./db:/var/lib/postgresql/data  # Persistent database storage
              environment:
                - POSTGRES_DB=${POSTGRES_DB}
                - POSTGRES_USER=${POSTGRES_USER}
                - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                # Optimized initialization for UTF-8 and better performance
                - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
              networks:
                - nextcloud-network
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
                interval: 30s
                timeout: 10s
                retries: 3

            # -----------------------------------------------------------------------
            # REDIS CACHE
            # -----------------------------------------------------------------------
            # In-memory cache for sessions, file locking, and application cache
            redis:
              image: redis:7-alpine          # Latest stable Redis
              container_name: nextcloud-redis
              restart: unless-stopped
              ports:
                - "6379:6379"                # Exposed for development/debugging
              volumes:
                - ./redis:/data              # Persistent Redis data (snapshots)
              command: redis-server --save 60 1 --loglevel warning
              # Save snapshot if at least 1 key changed in 60 seconds
              networks:
                - nextcloud-network
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 30s
                timeout: 10s
                retries: 3

            # -----------------------------------------------------------------------
            # ADMINER DATABASE MANAGEMENT (DEVELOPMENT ONLY)
            # -----------------------------------------------------------------------
            # Web-based database administration tool for development and debugging
            # WARNING: Remove this service in production deployments for security
            adminer:
              image: adminer                 # Lightweight database management UI
              container_name: nextcloud-adminer
              restart: unless-stopped
              ports:
                - "8081:8080"                # Access at http://localhost:8081
              environment:
                - ADMINER_DEFAULT_SERVER=db  # Pre-select database server
              depends_on:
                - db                         # Database must be available
              networks:
                - nextcloud-network
              # To access Adminer:
              # URL: http://localhost:8081
              # Server: db
              # Username: nextcloud (or your POSTGRES_USER)
              # Password: (your POSTGRES_PASSWORD)
              # Database: nextcloud (or your POSTGRES_DB)

          # =========================================================================
          # DOCKER VOLUMES
          # =========================================================================
          # Named volumes for data that should persist across container restarts
          volumes:
            nextcloud_data:                 # Shared Nextcloud application files

          # =========================================================================
          # DOCKER NETWORKS
          # =========================================================================
          # Private network for inter-container communication
          # Provides isolation from other Docker networks and the host
          networks:
            nextcloud-network:
              driver: bridge                 # Standard Docker bridge network
              # All containers can communicate with each other by name
              # External access only through explicitly exposed ports

    # Nginx configuration
    - path: /opt/nextcloud/nginx/nextcloud.conf
      mode: 0644
      contents:
        inline: |
          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              
              # Basic Settings
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              client_max_body_size 16G;
              
              # Gzip Settings
              gzip on;
              gzip_vary on;
              gzip_comp_level 6;
              gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
              
              upstream nextcloud {
                  server nextcloud:80;
              }
              
              # HTTP server (development friendly)
              server {
                  listen 80;
                  server_name _;
                  
                  location / {
                      proxy_pass http://nextcloud;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                      proxy_set_header X-Forwarded-Host $host;
                      proxy_set_header X-Forwarded-Port $server_port;
                  }
              }
              
              # HTTPS server (with self-signed cert for development)
              server {
                  listen 443 ssl http2;
                  server_name _;
                  
                  # SSL configuration (self-signed for development)
                  ssl_certificate /etc/nginx/ssl/cert.pem;
                  ssl_certificate_key /etc/nginx/ssl/key.pem;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
                  ssl_prefer_server_ciphers off;
                  
                  # Basic security headers for development
                  add_header X-Content-Type-Options "nosniff" always;
                  add_header X-Frame-Options "SAMEORIGIN" always;
                  add_header X-XSS-Protection "1; mode=block" always;
                  
                  # Remove X-Powered-By
                  fastcgi_hide_header X-Powered-By;
                  
                  # set max upload size
                  client_max_body_size 16G;
                  fastcgi_buffers 64 4K;
                  
                  location / {
                      proxy_pass http://nextcloud;
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto https;
                      proxy_set_header X-Forwarded-Host $host;
                      proxy_set_header X-Forwarded-Port $server_port;
                      
                      # Timeouts
                      proxy_connect_timeout 60s;
                      proxy_send_timeout 60s;
                      proxy_read_timeout 60s;
                  }
              }
          }

    # Simple SSL generation script for development
    - path: /opt/bin/generate-dev-ssl.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          # Generate self-signed SSL certificates for development
          
          SSL_DIR="/opt/nextcloud/ssl"
          mkdir -p "$SSL_DIR"
          
          echo "Generating self-signed SSL certificate for development..."
          openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes \
              -keyout "$SSL_DIR/key.pem" \
              -out "$SSL_DIR/cert.pem" \
              -subj "/C=US/ST=Dev/L=Local/O=Development/CN=localhost" \
              -addext "subjectAltName=DNS:localhost,DNS:*.localhost,IP:127.0.0.1,IP:10.0.2.15"
          
          chmod 600 "$SSL_DIR"/*.pem
          echo "SSL certificate generated at $SSL_DIR"

    # Development helper scripts
    - path: /opt/bin/nextcloud-logs.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose logs -f "$@"

    - path: /opt/bin/nextcloud-shell.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose exec nextcloud bash

    - path: /opt/bin/nextcloud-occ.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          cd /opt/nextcloud
          docker-compose exec -u www-data nextcloud php occ "$@"

    - path: /opt/bin/nextcloud-reset.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          # Reset Nextcloud for development (WARNING: Destroys all data!)
          
          echo "WARNING: This will destroy all Nextcloud data!"
          echo "Press Ctrl+C to cancel, or wait 10 seconds to continue..."
          sleep 10
          
          cd /opt/nextcloud
          docker-compose down -v
          rm -rf data/* config/* db/* redis/*
          docker-compose up -d
          
          echo "Nextcloud reset complete. Visit http://localhost:8080 to set up."

systemd:
  units:
    # Enable Docker
    - name: docker.service
      enabled: true

    # Download and setup Docker Compose
    - name: docker-compose-setup.service
      enabled: true
      contents: |
        [Unit]
        Description=Download Docker Compose binary
        After=network-online.target
        Wants=network-online.target
        ConditionFirstBoot=true
        ConditionPathExists=!/opt/bin/docker-compose
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/mkdir -p /opt/bin
        ExecStart=/bin/bash -c 'curl -L --connect-timeout 30 --max-time 300 -o /opt/bin/docker-compose "https://github.com/docker/compose/releases/download/v2.36.2/docker-compose-$(uname -s)-$(uname -m)"'
        ExecStart=/bin/chmod +x /opt/bin/docker-compose
        TimeoutStartSec=360
        
        [Install]
        WantedBy=multi-user.target

    # Enable systemd-sysext (for other extensions)
    - name: systemd-sysext.service
      enabled: true

    # Setup Nextcloud directories and SSL
    - name: setup-nextcloud-dev.service
      enabled: true
      contents: |
        [Unit]
        Description=Setup Nextcloud Development Environment
        After=docker.service
        Before=nextcloud-dev.service
        ConditionFirstBoot=true
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/mkdir -p /opt/nextcloud/data /opt/nextcloud/config /opt/nextcloud/apps
        ExecStart=/bin/mkdir -p /opt/nextcloud/db /opt/nextcloud/redis /opt/nextcloud/ssl
        ExecStart=/opt/bin/generate-dev-ssl.sh
        ExecStart=/bin/chown -R core:core /opt/nextcloud
        
        [Install]
        WantedBy=multi-user.target

    # Nextcloud development service
    - name: nextcloud-dev.service
      enabled: true
      contents: |
        [Unit]
        Description=Nextcloud Development Docker Compose Stack
        After=setup-nextcloud-dev.service docker-compose-setup.service
        Requires=docker.service setup-nextcloud-dev.service docker-compose-setup.service
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        WorkingDirectory=/opt/nextcloud
        User=core
        Group=core
        Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        
        # Always pull latest images in development
        ExecStartPre=/opt/bin/docker-compose pull
        ExecStartPre=-/opt/bin/docker-compose down
        ExecStart=/opt/bin/docker-compose up -d
        ExecReload=/opt/bin/docker-compose restart
        ExecStop=/opt/bin/docker-compose down
        
        # Auto-restart on failure
        Restart=on-failure
        RestartSec=10
        TimeoutStartSec=180
        
        [Install]
        WantedBy=multi-user.target

    # Development log aggregation
    - name: nextcloud-dev-logs.service
      enabled: true
      contents: |
        [Unit]
        Description=Nextcloud Development Log Viewer
        After=nextcloud-dev.service
        
        [Service]
        Type=simple
        User=core
        Group=core
        WorkingDirectory=/opt/nextcloud
        Environment=PATH=/opt/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        ExecStart=/opt/bin/docker-compose logs -f
        Restart=always
        RestartSec=5
        StandardOutput=journal
        StandardError=journal
        
        [Install]
        WantedBy=multi-user.target

    # Quick access to development URLs
    - name: nextcloud-dev-info.service
      enabled: true
      contents: |
        [Unit]
        Description=Show Nextcloud Development URLs
        After=nextcloud-dev.service
        
        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/bin/bash -c 'sleep 30'
        ExecStart=/bin/bash -c 'echo "=== Nextcloud Development URLs ==="'
        ExecStart=/bin/bash -c 'echo "Main Nextcloud: http://localhost:8080"'
        ExecStart=/bin/bash -c 'echo "Via proxy: https://localhost (self-signed cert)"'
        ExecStart=/bin/bash -c 'echo "Database admin: http://localhost:8081"'
        ExecStart=/bin/bash -c 'echo "Default admin: admin / admin123"'
        ExecStart=/bin/bash -c 'echo "=================================="'
        
        [Install]
        WantedBy=multi-user.target
