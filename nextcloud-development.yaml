# =========================================================================
# SIMPLIFIED NEXTCLOUD DEVELOPMENT SETUP FOR FLATCAR CONTAINER LINUX
# =========================================================================
#
# This simplified Butane configuration creates a basic Nextcloud development
# environment optimized for quick setup and testing:
#
# FEATURES:
# - Direct Nextcloud access (no reverse proxy)
# - Simple, memorable passwords (admin/admin123)
# - PostgreSQL database with Redis cache
# - Adminer for database management
# - Essential utility scripts only
#
# ARCHITECTURE:
# - Nextcloud (latest) + PostgreSQL 15 + Redis 7
# - Direct access via port 8080
# - Minimal services for faster startup
# - Optional Collabora add-on available separately
#
# QUICK START:
# 1. Replace SSH key below with your public key
# 2. Convert: butane --pretty --strict nextcloud-development.yaml > dev.ign
# 3. Run: ./flatcar_production_qemu.sh -i dev.ign -M 4096 -f 8080:8080 -f 8081:8081
# 4. Access: http://localhost:8080 (admin/admin123)
#
# =========================================================================

variant: flatcar
version: 1.0.0

passwd:
  users:
  - name: core
    groups:
    - docker
    - sudo
    ssh_authorized_keys:
    - "ssh-rsa  jan@jan-B550-GAMING-X-V2"
    # Replace with your SSH public key

storage:
  directories:
  - path: /opt/nextcloud
    mode: 493 # 0755 in decimal
  - path: /opt/bin
    mode: 493 # 0755 in decimal
  files:
  # Configuration files
  - path: /opt/nextcloud/.env
    mode: 384 # 0600 in decimal
    contents:
      local: configs/.env

  - path: /opt/nextcloud/docker-compose.yml
    mode: 420 # 0644 in decimal
    contents:
      local: configs/docker-compose.yml

  # Optional Collabora add-on
  - path: /opt/nextcloud/docker-compose.collabora.yml
    mode: 420 # 0644 in decimal
    contents:
      local: configs/docker-compose.collabora.yml

  # Essential utility scripts
  - path: /opt/bin/nextcloud-logs.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-logs.sh

  - path: /opt/bin/nextcloud-shell.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-shell.sh

  - path: /opt/bin/nextcloud-occ.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-occ.sh

  - path: /opt/bin/nextcloud-reset.sh
    mode: 493 # 0755 in decimal
    contents:
      local: scripts/nextcloud-reset.sh

  # Systemd services
  - path: /etc/systemd/system/docker-compose-setup.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/docker-compose-setup.service

  - path: /etc/systemd/system/setup-nextcloud-dev.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/setup-nextcloud-dev.service

  - path: /etc/systemd/system/nextcloud-dev.service
    mode: 420 # 0644 in decimal
    contents:
      local: services/nextcloud-dev.service

systemd:
  units:
  - name: docker.service
    enabled: true

  - name: docker-compose-setup.service
    enabled: true

  - name: systemd-sysext.service
    enabled: true

  - name: setup-nextcloud-dev.service
    enabled: true

  - name: nextcloud-dev.service
    enabled: true
