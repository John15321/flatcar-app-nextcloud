# =========================================================================
# NEXTCLOUD DEVELOPMENT CONFIGURATION FOR FLATCAR CONTAINER LINUX
# =========================================================================
#
# This Butane configuration creates a development-friendly Nextcloud setup
# optimized for local testing, learning, and development work with:
#
# DEVELOPMENT FEATURES:
# - Simple, memorable passwords (admin/admin123)
# - Adminer database management interface (:8081)
# - Exposed database ports for external tools
# - Multiple trusted domains for local access
# - Lower resource requirements
#
# ARCHITECTURE:
# - Nextcloud (latest) with PostgreSQL 15 and Redis 7
# - Nginx reverse proxy for production-like setup
# - All data stored on root filesystem (no additional disk needed)
# - Development tools included (Adminer)
#
# INTENDED USE:
# - Local development on laptop/PC
# - Testing Nextcloud configurations
# - Learning how the system works
# - Debugging and troubleshooting
#
# NOT FOR PRODUCTION:
# - Simple passwords are insecure
# - Exposed database ports
# - Development tools included
# - Less restrictive security settings
#
# QUICK START:
# 1. Replace "your-ssh-key-here" with your SSH public key
# 2. Convert: butane --pretty --strict nextcloud-development.yaml > dev.ign
# 3. Run: ./flatcar_production_qemu.sh -i dev.ign -M 4096 -f 8080:8080 -f 8081:8081 -f 9980:9980 -- -display curses -snapshot
# 4. Access: http://localhost:8080 (admin/admin123)
# 5. Wait for app installation to complete (may take several minutes)
#
# =========================================================================

variant: flatcar
version: 1.0.0

# Development configuration for Nextcloud on Flatcar Linux
# This configuration is optimized for development and testing

# USER CONFIGURATION
# Uses the default 'core' user for simplicity in development
passwd:
    users:
      - name: core # Default Flatcar user
        groups:
          - docker # Access to Docker daemon
          - sudo # Administrative privileges
        ssh_authorized_keys:
          - "ssh-rsa  jan@jan-B550-GAMING-X-V2"
          # Add your public SSH key above - generate with: ssh-keygen -t ed25519
          # This allows SSH access: ssh -p 2222 core@localhost

storage:
    directories:
      - path: /opt/nextcloud # Main application directory
        mode: 0755
      - path: /opt/bin # Development scripts directory
        mode: 0755
      - path: /var/log/nextcloud # Centralized logging
        mode: 0755
    files:

# CONFIGURATION FILES

      - path: /opt/nextcloud/.env
        mode: 0600 # Secure file permissions
        contents:
            local: ./configs/.env

      - path: /opt/nextcloud/docker-compose.yml
        mode: 0644
        contents:
            local: ./configs/docker-compose.yml

      - path: /opt/nextcloud/nginx/nextcloud.conf
        mode: 0644
        contents:
            local: ./nginx/nextcloud.conf

# SHELL SCRIPTS

      - path: /opt/bin/generate-dev-ssl.sh
        mode: 0755
        contents:
            local: ./scripts/generate-dev-ssl.sh

      - path: /opt/bin/nextcloud-logs.sh
        mode: 0755
        contents:
            local: ./scripts/nextcloud-logs.sh

      - path: /opt/bin/nextcloud-shell.sh
        mode: 0755
        contents:
            local: ./scripts/nextcloud-shell.sh

      - path: /opt/bin/nextcloud-occ.sh
        mode: 0755
        contents:
            local: ./scripts/nextcloud-occ.sh

      - path: /opt/bin/nextcloud-reset.sh
        mode: 0755
        contents:
            local: ./scripts/nextcloud-reset.sh

      - path: /opt/bin/nextcloud-install-apps.sh
        mode: 0755
        contents:
            local: ./scripts/nextcloud-install-apps.sh

      - path: /opt/bin/check-collabora.sh
        mode: 0755
        contents:
            local: ./scripts/check-collabora.sh

      - path: /opt/bin/restart-collabora.sh
        mode: 0755
        contents:
            local: ./scripts/restart-collabora.sh

      - path: /opt/bin/run-collabora-check.sh
        mode: 0755
        contents:
            local: ./scripts/run-collabora-check.sh

      # SYSTEMD SERVICE CONFIGURATION FILES

      - path: /etc/systemd/system/docker-compose-setup.service
        mode: 0644
        contents:
            local: ./services/docker-compose-setup.service

      - path: /etc/systemd/system/setup-nextcloud-dev.service
        mode: 0644
        contents:
            local: ./services/setup-nextcloud-dev.service

      - path: /etc/systemd/system/nextcloud-dev.service
        mode: 0644
        contents:
            local: ./services/nextcloud-dev.service

      - path: /etc/systemd/system/nextcloud-dev-logs.service
        mode: 0644
        contents:
            local: ./services/nextcloud-dev-logs.service

      - path: /etc/systemd/system/nextcloud-dev-info.service
        mode: 0644
        contents:
            local: ./services/nextcloud-dev-info.service

      - path: /etc/systemd/system/nextcloud-install-apps.service
        mode: 0644
        contents:
            local: ./services/nextcloud-install-apps.service

      - path: /etc/systemd/system/run-collabora-check.service
        mode: 0644
        contents:
            local: ./services/run-collabora-check.service

      - path: /etc/systemd/system/run-collabora-check.timer
        mode: 0644
        contents:
            local: ./services/run-collabora-check.timer

systemd:
    units:
      - name: docker.service
        enabled: true

      - name: docker-compose-setup.service
        enabled: true

      - name: systemd-sysext.service
        enabled: true

      - name: setup-nextcloud-dev.service
        enabled: true

      - name: nextcloud-dev.service
        enabled: true

      - name: nextcloud-dev-logs.service
        enabled: true

      - name: nextcloud-dev-info.service
        enabled: true

      - name: nextcloud-install-apps.service
        enabled: true

      - name: run-collabora-check.service
        enabled: true

      - name: run-collabora-check.timer
        enabled: true
