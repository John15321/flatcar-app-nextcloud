# =========================================================================
# APACHE SSL CONFIGURATION FOR NEXTCLOUD INTERNAL HTTPS
# =========================================================================

<VirtualHost *:443>
    DocumentRoot /var/www/html
    ServerName nextcloud-app
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/internal/nextcloud-app.crt
    SSLCertificateKeyFile /etc/ssl/internal/nextcloud-app.key
    SSLCACertificateFile /etc/ssl/internal/ca.crt
    
    # Modern SSL Configuration
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder     off
    SSLSessionTickets       off
    
    # HSTS for internal communications
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "no-referrer"
    
    # Enable rewrite module for Nextcloud
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^nextcloud-app$
    RewriteRule ^/.well-known/carddav /remote.php/dav/ [R=301,L]
    RewriteRule ^/.well-known/caldav /remote.php/dav/ [R=301,L]
    
    # Standard Nextcloud configuration
    <Directory /var/www/html/>
        Options +FollowSymlinks
        AllowOverride All
        Require all granted
        
        <IfModule mod_dav.c>
            Dav off
        </IfModule>
        
        SetEnv HOME /var/www/html
        SetEnv HTTP_HOME /var/www/html
    </Directory>
    
    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "no-referrer"
        Header always set X-Permitted-Cross-Domain-Policies "none"
        Header always set X-Robots-Tag "none"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName nextcloud-app
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
