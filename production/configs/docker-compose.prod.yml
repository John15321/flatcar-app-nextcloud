# =========================================================================
# NEXTCLOUD PRODUCTION SETUP - SECURITY HARDENED
# =========================================================================
#
# Production Docker Compose with:
# - Traefik reverse proxy with automatic SSL
# - Security-hardened configuration
# - Network isolation
# - Production logging
# - Health checks and monitoring
#
# =========================================================================

services:
  # -----------------------------------------------------------------------
  # TRAEFIK REVERSE PROXY - SSL TERMINATION
  # -----------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: nextcloud-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard (admin only)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik:ro
      - traefik_certs:/certs
    environment:
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_API_INSECURE=false
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN:-traefik.${DOMAIN}}`)"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_AUTH}"

  # -----------------------------------------------------------------------
  # NEXTCLOUD APPLICATION
  # -----------------------------------------------------------------------
  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud-app
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - nextcloud_data:/var/www/html
      - ./config:/var/www/html/config
      - ./data:/var/www/html/data
      - ./apps:/var/www/html/custom_apps
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${DOMAIN},${PUBLIC_IP}
      - REDIS_HOST=redis
      - REDIS_HOST_PORT=6379
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${DOMAIN}
      - OVERWRITECLIURL=https://${DOMAIN}
    depends_on:
      - db
      - redis
    networks:
      - nextcloud-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      
      # Security headers
      - "traefik.http.middlewares.nextcloud-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.nextcloud-headers.headers.customrequestheaders.X-Forwarded-For="
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"
      - "traefik.http.middlewares.nextcloud-headers.headers.customresponseheaders.X-Content-Type-Options=nosniff"
      - "traefik.http.middlewares.nextcloud-headers.headers.customresponseheaders.Referrer-Policy=strict-origin-when-cross-origin"

  # -----------------------------------------------------------------------
  # COLLABORA ONLINE - DOCUMENT EDITING
  # -----------------------------------------------------------------------
  collabora:
    image: collabora/code:latest
    container_name: nextcloud-collabora
    restart: unless-stopped
    expose:
      - "9980"
    environment:
      - domain=${DOMAIN}
      - DONT_GEN_SSL_CERT=1
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
      - username=${COLLABORA_ADMIN_USER}
      - password=${COLLABORA_ADMIN_PASSWORD}
      - server_name=collabora.${DOMAIN}
    cap_add:
      - MLOCK
    networks:
      - nextcloud-internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`collabora.${DOMAIN}`)"
      - "traefik.http.routers.collabora.tls=true"
      - "traefik.http.routers.collabora.tls.certresolver=letsencrypt"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
      - "traefik.http.routers.collabora.middlewares=collabora-headers"
      
      # Collabora security headers
      - "traefik.http.middlewares.collabora-headers.headers.customresponseheaders.X-Frame-Options=SAMEORIGIN"

  # -----------------------------------------------------------------------
  # POSTGRESQL DATABASE
  # -----------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - nextcloud-internal
    # No external ports for security

  # -----------------------------------------------------------------------
  # REDIS CACHE
  # -----------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - nextcloud-internal
    # No external ports for security

  # -----------------------------------------------------------------------
  # WATCHTOWER - AUTOMATIC UPDATES
  # -----------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower
    container_name: nextcloud-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 0 2 * * *  # 2 AM daily
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
    networks:
      - nextcloud-internal

volumes:
  nextcloud_data:
  postgres_data:
  redis_data:
  traefik_certs:

networks:
  traefik:
    external: true
  nextcloud-internal:
    driver: bridge
    internal: true
